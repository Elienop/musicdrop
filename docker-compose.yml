# MusicDrop — example deployment. Copy, adjust paths, `docker compose up -d`.
services:
  musicdrop:
    image: ghcr.io/elienop/musicdrop:latest
    container_name: musicdrop
    ports:
      - "3030:3030"
    environment:
      # Match the owner of your music share so tag writes / reorganize land
      # with the right ownership.
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # OPTIONAL override — the single account's password, as a scrypt hash.
      # Normally leave this unset: on first run the sign-in screen is a setup
      # form that stores the hash under /data (beets/password-hash), and
      # Settings → Account changes it later. Set here, it WINS over that file
      # and hides both forms — even when the value is unreadable, in which case
      # every sign-in is refused until it is fixed or removed (the startup log
      # says so). Keeping it set is also how the password survives a lost
      # /data volume: with the file as the only source, an empty bind mount or
      # a restore without that file brings the setup form back. Generate one with:
      #   docker exec -it musicdrop python -m app.auth.hash_password
      # Note the DOUBLED $$: compose reads a $ followed by a letter or _ as a
      # variable reference (a $ before a digit is left alone), so the hash's
      # letter-led fields have to be escaped here (an env_file entry does not
      # need this). The generator prints this doubled form as well.
      # - MUSICDROP_PASSWORD_HASH=scrypt$$131072$$8$$1$$c2FsdA==$$ZGlnZXN0
      # Optional integrations (see README):
      # - MUSICDROP_ARTIST_IMAGE_FANARTTV_API_KEY=...
      # - MUSICDROP_INBOX_DIR=/media/downloads/slskd   # slskd's downloads, inside /media
      # Mount only that downloads folder into slskd, never all of /media: a
      # network-facing P2P client needs no write access to your library.
      # Trash: default under /data (a delete copies across mounts); inside the
      # library a delete is a rename. It may not be or contain the library or /data/beets.
      # - MUSICDROP_TRASH_DIR=/media/music/.trash
      # Browsing MusicDrop via a DNS name (e.g. behind Caddy/Traefik/nginx)?
      # List every such name here or those requests are rejected with a 400
      # (the DNS-rebinding guard). By-IP access needs nothing.
      # Also list names other containers use to call MusicDrop (e.g. slskd's webhook URL host).
      # - MUSICDROP_ALLOWED_HOSTS=music.example.com
    volumes:
      - ./data:/data            # beets library.db + config.yaml + app state
      - /path/to/media:/media   # ONE folder on ONE filesystem, holding for example:
                                #   /media/music             your library (beets `directory`)
                                #   /media/downloads/slskd   slskd's downloads
                                # Create music/ in it first: MusicDrop does not, and
                                # every import refuses while the library folder is missing.
    restart: unless-stopped

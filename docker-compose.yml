# MusicDrop — example deployment. Copy, adjust paths, `docker compose up -d`.
services:
  musicdrop:
    image: ghcr.io/elienop/musicdrop:latest
    container_name: musicdrop
    ports:
      - "3030:3030"
    environment:
      # Match the owner of your music share so tag writes / reorganize land
      # with the right ownership.
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # REQUIRED — the single account's password, as a scrypt hash. Until this
      # is set every /api request is refused with a 401 (the startup log says
      # so). Generate one with:
      #   docker exec -it musicdrop python -m app.auth.hash_password
      # Note the DOUBLED $$: compose expands a single $ as a variable, so the
      # hash's own separators have to be escaped here (an env_file entry does
      # not need this).
      # - MUSICDROP_PASSWORD_HASH=scrypt$$131072$$8$$1$$c2FsdA==$$ZGlnZXN0
      # Optional integrations (see README):
      # - MUSICDROP_ARTIST_IMAGE_FANARTTV_API_KEY=...
      # - MUSICDROP_INBOX_DIR=/inbox   # pair with the /inbox volume below
      # Browsing MusicDrop via a DNS name (e.g. behind Caddy/Traefik/nginx)?
      # List every such name here or those requests are rejected with a 400
      # (the DNS-rebinding guard). By-IP access needs nothing.
      # Also list names other containers use to call MusicDrop (e.g. slskd's webhook URL host).
      # - MUSICDROP_ALLOWED_HOSTS=music.example.com
    volumes:
      - ./data:/data            # beets library.db + config.yaml + app state
      - /path/to/music:/music   # your music library (beets `directory`)
      # - /path/to/slskd/downloads:/inbox   # if using slskd acquisition
    restart: unless-stopped

[project]
name = "musicdrop"
version = "0.1.0"
description = "A self-hosted web UI for beets — browse your music library, run tagging & enrichment, and build Plex-compatible playlists."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.15.0",
    "beets==2.13.*",
    "beautifulsoup4>=4.15.0",
    "langdetect>=1.0.9",
    "httpx>=0.28.1",
    "ruamel.yaml>=0.15.93",
    "python-multipart>=0.0.32",
    "plexapi>=4.18.2,<5",
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PT018 (single rule, not the PT family): composite asserts split in the
# 2026-08-25 Sonar pass must not regrow. Requires preview for the autofix
# only; selection alone works in stable mode.
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["beets.*", "beetsplug.*", "mediafile", "yaml", "requests.*", "plexapi.*"]
ignore_missing_imports = true

# beets is untyped; calling its functions trips disallow_untyped_calls under
# strict mode. The adapter is the boundary that absorbs that, and the album
# tests build a real beets library through the same untyped surface.
[[tool.mypy.overrides]]
module = [
    "app.beets.library",
    "app.beets.browse",
    "app.beets.import_mapping",
    "app.beets.import_session",
    "app.beets.setup",
    "app.beets.config_snapshot",
    "app.beets.config_editor",
    "app.beets.duplicates",
    "app.beets.existing_album",
    "app.beets.edit",
    "app.beets.cover",
    "app.import_jobs.runner",
    "tests.conftest",
    "tests.test_albums",
    "tests.test_artists",
    "tests.test_browse",
    "tests.test_search",
    "tests.test_import_mapping",
    "tests.test_import_session",
    "tests.test_import_sweep",
    "tests.test_import_runner",
    "tests.test_inlibrary_apply_move_repro",
    "tests.test_import_path_representation",
    "tests.test_ghost_replace_repro",
    "tests.test_import_setup",
    "tests.test_setup_beets",
    "tests.test_config_snapshot",
    "tests.test_config_api",
    "tests.test_config_editor_models",
    "tests.test_config_editor_parse_validate",
    "tests.test_config_editor_secrets",
    "tests.test_config_editor_atomic_write",
    "tests.test_config_validate_api",
    "tests.test_config_save_api",
    "tests.test_config_apply_api",
    "tests.test_reset_beets_globals",
    "tests.test_duplicates_detection",
    "tests.test_duplicates_resolve",
    "tests.test_bank_duplicate_detect",
    "tests.test_import_upfront_duplicates",
    "tests.test_trash",
    "tests.test_edit_adapter",
    "tests.test_cover_adapter",
    "tests.test_cover_api",
    "app.beets.completeness",
    "tests.test_completeness_adapter",
    "tests.test_completeness_api",
    "app.beets.lyrics",
    "app.api.lyrics",
    "tests.test_lyrics_adapter",
    "tests.test_lyrics_api",
    "tests.test_lyrics_sidecars",
    "app.lyrics_jobs.registry",
    "app.lyrics_jobs.runner",
    "tests.test_lyrics_backfill",
    "app.beets.delete",
    "tests.test_delete",
    "app.beets.relookup",
    "tests.test_relookup",
    "app.beets.research",
    "tests.test_research",
    "app.beets.rename",
    "app.beets.trash_manage",
    "tests.test_trash_manage",
    "tests.test_artwork_library_mbid",
    "tests.test_artist_art_write",
    "tests.test_artist_art_mutex",
    "app.beets.reorganize",
    "app.reorganize_jobs.registry",
    "app.reorganize_jobs.runner",
    "app.api.reorganize",
    "tests.test_reorganize_adapter",
    "tests.test_reorganize_jobs",
    "tests.test_reorganize_api",
    "tests.test_reorganize_mutex",
    "tests.test_disk_sync_mutex",
    "app.beets.naming",
    "tests.test_naming_adapter",
    "tests.test_naming_api",
    "app.beets.stats",
    "app.api.stats",
    "tests.test_stats_adapter",
    "tests.test_stats_api",
    "app.beets.playlists",
    "app.beets.playlist_match",
    "tests.test_playlists_beets",
    "tests.test_playlists_api",
    "tests.test_playlist_match",
    "tests.test_playlist_import_api",
    "app.beets.disk_sync",
    "app.api.disk_sync",
    "tests.test_disk_sync_adapter",
    "tests.test_disk_sync_jobs",
    "tests.test_disk_sync_api",
    "app.plex.client",
    "app.plex.mapping",
    "app.plex.service",
    "app.plex.sync",
    "tests.test_plex_adapter",
    "tests.test_plex_mapping",
    "tests.test_plex_api",
    "tests.test_plex_sync",
]
disallow_untyped_calls = false

# Coverage is opt-in: nothing here runs unless pytest is given --cov (see the
# `coverage` target in the repo-root Makefile, which the `sonar-scan` wrapper
# runs before every upload). `relative_files` keeps the report free of this
# machine's absolute paths; scripts/rebase_coverage_source.py then moves its one
# <source> element from `app` to `backend/app`, because the SonarQube scanner
# resolves every path against the REPO root while pytest must run from here.
# `branch` matters for comparability: the frontend's v8 provider reports branch
# coverage, so without it the blended project figure would average a
# lines-and-branches number against a lines-only one and flatter Python.
[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "anyio: run an async test under anyio (asyncio backend; see conftest).",
]

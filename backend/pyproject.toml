[project]
name = "musicdrop"
version = "0.1.0"
description = "A self-hosted web UI for beets — browse your music library, run tagging & enrichment, and build Plex-compatible playlists."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "beets>=2.11.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["beets.*", "beetsplug.*", "mediafile"]
ignore_missing_imports = true

# beets is untyped; calling its functions trips disallow_untyped_calls under
# strict mode. The adapter is the boundary that absorbs that, and the album
# tests build a real beets library through the same untyped surface.
[[tool.mypy.overrides]]
module = ["app.beets.library", "app.beets.import_mapping", "app.beets.import_session", "app.import_jobs.runner", "tests.test_albums", "tests.test_artists", "tests.test_search", "tests.test_import_mapping", "tests.test_import_session"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "anyio: run an async test under anyio (asyncio backend; see conftest).",
]

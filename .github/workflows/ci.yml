name: CI

# No bare `push` trigger: every branch lands via a PR (repo rule), so
# `pull_request` covers branch CI — a push trigger would run the identical
# suite twice per push. main is gated by release.yml calling this workflow.
on:
  pull_request:
  workflow_call:
    inputs:
      build_image:
        description: >-
          Build the Docker image as a gate. release.yml passes false: its own
          release job builds and pushes the real image immediately after these
          gates, and a failure there aborts the release before any tag exists —
          so a throwaway build here only pays for the same work twice.
        type: boolean
        default: true

# One live run per PR: a re-push cancels the superseded run instead of letting
# it burn minutes. When called from release.yml (event = push to main) the
# condition is false, and release.yml's own release-main group already
# serializes those runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here only reads the repo — none tags, comments, or publishes; release.yml
# declares `contents: write` on its own release job for that. Stated explicitly rather
# than relying on the repository setting (`default_workflow_permissions: read`), which
# lives in the web UI and can be flipped to read/write with no diff and no review. Four
# steps in the frontend job execute repo-controlled JavaScript — `gen:api`, `lint`,
# `test`, `build` — so what the token can do at that moment belongs under review.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tests/test_cited_shas.py resolves every sha cited in a comment
          # against origin/main, which a shallow clone cannot do. Cheap here:
          # the whole history is under 10 MB.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        env:
          # tests/test_trash_replaced_xdev.py needs two filesystems (Trash on
          # /dev/shm, the library on /tmp) to make os.rename raise EXDEV itself.
          # This turns "no second filesystem" from a skip into a failure, so the
          # only real cross-device coverage cannot go quietly green here.
          MUSICDROP_REQUIRE_XDEV: "1"
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types match the tracked contract
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts

      # Mirrors the backend's `ruff check` seat: lint before typecheck. Every rule
      # enabled in eslint.config.js pins a SonarQube family this project already
      # cleared, so this is the frontend half of the lock-on-clear rule that the
      # backend has honoured through ruff `select` all along. The `Test` step below
      # covers eslint.config.test.ts, which proves each of those rules still fires —
      # without it a broken config would pass this step by finding nothing.
      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    # A PR is the ONLY place the Dockerfile is exercised without also shipping,
    # so it always builds here. A caller can opt out (release.yml does).
    #
    # The `github.event_name` half is load-bearing, not belt-and-braces: the
    # `inputs` context does not exist outside workflow_call/workflow_dispatch,
    # so on a `pull_request` event `inputs.build_image` is the empty string and
    # the `default: true` above never applies. `if: inputs.build_image` alone
    # would silently skip this job on every PR — the one place it matters most.
    if: ${{ github.event_name == 'pull_request' || inputs.build_image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (no push)
        run: docker build -t musicdrop:ci .

name: Release

on:
  push:
    branches: [main]
    # Docs-only merges don't change the image — skip the release entirely.
    paths-ignore:
      - "**.md"
      - "docs/**"

# Serialize release runs so two near-simultaneous pushes to main can't push
# image vX while the other creates git tag vX+1. cancel-in-progress is false
# because cancelling mid-push could orphan a half-published image.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Identical gates to a PR — a release never ships with fewer checks.
  gates:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # 1. COMPUTE the next version only (no tag yet). Conventional commits
      #    drive the bump: breaking (! or BREAKING CHANGE) -> major,
      #    feat -> minor, anything else -> patch — the max across the pushed
      #    commits wins. Tagging AFTER the image push closes the orphaned-tag
      #    hole: a failed build/push leaves no tag, so the next push retries
      #    cleanly; a re-run on an already-tagged HEAD aborts here instead of
      #    pushing an invalid ref.
      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match 'v*')
          if [ "$(git rev-list -n1 "$last_tag")" = "$(git rev-list -n1 HEAD)" ]; then
            echo "HEAD already tagged $last_tag — nothing to release."
            exit 1
          fi
          subjects=$(git log --format=%s "$last_tag"..HEAD)
          bodies=$(git log --format=%b "$last_tag"..HEAD)
          bump=patch
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qF 'BREAKING CHANGE' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump=minor
          fi
          IFS=. read -r major minor patch <<<"${last_tag#v}"
          case $bump in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            patch) new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "$bump: $last_tag -> $new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2.+3. Build for amd64 and push with the computed tag. arm64 was dropped:
      #       it built under QEMU emulation (by far the slowest step, ~minutes to
      #       hours) and the deploy target is amd64. QEMU setup removed with it.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.new_tag }}
          tags: |
            ghcr.io/elienop/musicdrop:${{ steps.version.outputs.new_tag }}
            ghcr.io/elienop/musicdrop:latest

      # 4. Image is live -> NOW create the real git tag. The checkout's
      #    persisted GITHUB_TOKEN can push refs (permissions: contents: write).
      - name: Create and push tag
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.new_tag }}"

      # 5. Release last, against the now-existing tag + live image.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --title "${{ steps.version.outputs.new_tag }}" \
            --generate-notes --verify-tag

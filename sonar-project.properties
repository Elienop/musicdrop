# SonarQube analysis config for MusicDrop (local Community Build server; run `sonar-scan`
# from this directory). No secrets here — the token and host come from the environment.
#
# Sources and tests both start at the repo root; the scanner turns sonar.test.inclusions
# into source exclusions automatically. sonar.exclusions filters the SOURCE scope only, so
# vendored/large trees are also listed in sonar.test.exclusions.
# data/ (music library, cache — 68 GB, git-ignored) and the venvs are excluded outright so
# the indexer never walks them.

sonar.projectKey=musicdrop
sonar.projectName=MusicDrop
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=backend/tests/**,**/*.test.ts,**/*.test.tsx
sonar.test.exclusions=**/node_modules/**,**/.venv/**,frontend/dist/**,dist/**,data/**,backend/data/**,.claude/**

sonar.exclusions=\
  .claude/**,**/node_modules/**,**/.venv/**,frontend/dist/**,dist/**,\
  data/**,backend/data/**,\
  frontend/src/components/ui/**,\
  frontend/src/api/schema.d.ts,\
  docs/**,.github/**

# Python: the backend targets 3.11+ (pyproject); tell the analyzer so version-specific rules apply.
sonar.python.version=3.11,3.12,3.13

# TypeScript: tsconfig files auto-detected (frontend/tsconfig.json references app/node configs).

# Coverage. `make coverage` (repo root) writes these files and the `sonar-scan`
# wrapper runs it before every upload; without them the Zero Coverage Sensor
# reports 0% for the whole project. Every path INSIDE a report is relative to
# the repo root — the scanner's base dir — which is what the rebasing in
# backend/scripts/rebase_coverage_source.py and frontend/vitest.config.ts is for.
sonar.python.coverage.reportPaths=backend/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Test execution — the "Unit Tests" count, pass density and duration, a separate
# channel from coverage. pytest's JUnit XML is written with --junit-prefix=backend
# so each classname resolves to backend/tests/test_*.py (xunit2 emits no file
# attribute, and SonarPython then falls back to classname with . -> / and .py);
# vitest-sonar-reporter writes the Generic Test Execution XML. Note the Python
# property is singular — one path only.
# That fallback is why backend tests must stay MODULE-LEVEL functions: pytest puts
# any enclosing class into the classname, so `class TestFoo:` yields
# backend/tests/test_x/TestFoo.py, which resolves to nothing — and those tests then
# stop counting, silently, with no warning in the scan log.
sonar.python.xunit.reportPath=backend/coverage/junit.xml
sonar.testExecutionReportPaths=frontend/coverage/sonar-report.xml

# Not coverable code: the React bundle entry point, the vitest setup/helpers, the
# frontend tool configs, and backend/scripts/ — developer tooling (the dev-library
# seed script, the Cobertura rebase) that the app never imports and that coverage's
# `source = ["app"]` therefore never measures, so without this it would be scored
# as 0%. Nothing under backend/app is excluded — it is all reachable through the
# API and the adapter, so a gap there is a real gap, not an artefact.
sonar.coverage.exclusions=\
  frontend/src/main.tsx,frontend/src/test/**,frontend/*.config.*,\
  backend/scripts/**
